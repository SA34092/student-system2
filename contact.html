<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - نظام الطالب الجامعي</title>
    <!-- ربط ملف الـ CSS الخارجي بشكل صحيح -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <h2>اتصل بنا</h2>
        <p style="text-align: center; color: #666; font-size: 14px; margin-bottom: 15px;">
            نحن هنا لمساعدتك. أرسل لنا استفسارك وسنرد عليك قريباً.
        </p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">الاسم:</label>
                <input type="text" id="name" name="name" placeholder="أدخل اسمك الكامل" required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="text" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="message">الرسالة:</label>
                <textarea id="message" name="message" rows="4" placeholder="اكتب رسالتك هنا..." required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: 'Cairo', sans-serif;"></textarea>
            </div>

            <button type="submit">إرسال الرسالة</button>
        </form>

        <!-- زر العودة لصفحة تسجيل الدخول أو الصفحة الرئيسية -->
        <div style="text-align: center; margin-top: 15px;">
            <a href="index.html" style="color: #008CBA; text-decoration: none; font-size: 14px;">← العودة لصفحة تسجيل الدخول</a>
        </div>
    </div>

</body>
</html>
