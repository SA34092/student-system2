<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>التسجيل</title>

<style>
body {
    font-family: Tahoma;
    background: #f0f4f8;
    text-align: center;
    padding: 50px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 10px;
    width: 350px;
    margin: auto;
}

button {
    background: #004080;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>📝 التسجيل للمواد</h2>

<form id="registerForm">

<input type="checkbox" name="subject" value="مقدمة في البرمجة">
مقدمة في البرمجة
<br><br>

<input type="checkbox" name="subject" value="قواعد البيانات">
قواعد البيانات
<br><br>

<input type="checkbox" name="subject" value="الشبكات">
الشبكات
<br><br>

<input type="checkbox" name="subject" value="نظم التشغيل">
نظم التشغيل
<br><br>

<button type="submit">تأكيد التسجيل</button>

</form>

<p id="message"></p>

<br>

<a href="main.html">الرجوع للصفحة الرئيسية</a>

</div>

<script>

document.getElementById("registerForm").onsubmit = function(event) {

event.preventDefault();

let selected = document.querySelectorAll('input[name="subject"]:checked');

if (selected.length === 0) {

document.getElementById("message").innerHTML =
"الرجاء اختيار مادة واحدة على الأقل";

return;

}

document.getElementById("message").innerHTML =
"✅ تم تأكيد التسجيل بنجاح! عدد المواد المسجلة: " + selected.length;

};

</script>

</body>
</html>
