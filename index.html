<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام الطالب الجامعي</title>
    
    <!-- التنسيقات مدمجة هنا مباشرة لتظهر فوراً دون مشاكل روابط أو استضافة -->
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            direction: rtl;
        }

        .login-container, form {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            text-align: right;
        }

        .form-group label {
            font-size: 14px;
            color: #444;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            outline: none;
            background-color: #fff;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }

        button, 
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            width: 100%;
            box-sizing: border-box;
        }

        button:hover {
            background-color: #45a049;
        }

        .secondary-btn {
            background-color: #008CBA;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            display: block;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            width: 100%;
        }

        .secondary-btn:hover {
            background-color: #007bb5;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="username">الرقم الجامعي:</label>
                <input type="text" id="username" name="username" placeholder="أدخل الرقم الجامعي" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة السر:</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة السر" required>
            </div>

            <button type="submit">دخول</button>
            <a href="contact.html" class="secondary-btn">اتصل بنا</a>
        </form>
    </div>

</body>
</html>
