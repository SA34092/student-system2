<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الطالب الجامعي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- رأس الصفحة (الهيدر) -->
        <header class="header">
            <h1 class="brand-title">نظام الطالب الجامعي <span class="sparkle">✦</span></h1>
            <div class="nav-buttons">
                <button class="btn-outline">الرئيسية</button>
                <button class="btn-outline">النتائج</button>
                <button class="btn-outline">التسجيل</button>
            </div>
            <button class="btn-outline logout-btn">تسجيل خروج</button>
        </header>

        <!-- نموذج تسجيل الدخول / بيانات الطالب -->
        <main class="form-card">
            <form>
                <div class="input-group">
                    <label for="student-name">اسم الطالب</label>
                    <input type="text" id="student-name" placeholder="اكتب اسمك الثلاثي">
                </div>

                <div class="input-group">
                    <label for="student-id">الرقم الجامعي</label>
                    <input type="text" id="student-id" placeholder="أدخل رقمك الجامعي">
                </div>

                <div class="input-group">
                    <label for="college">الكلية / القسم</label>
                    <input type="text" id="college" placeholder="مثال: العلوم الرياضية والحاسوب">
                </div>

                <button type="submit" class="btn-submit">دخول النظام</button>
            </form>
            
            <p class="success-message">مرحباً بك، يرجى إدخال بياناتك بدقة.</p>
        </main>
    </div>

</body>
</html>
